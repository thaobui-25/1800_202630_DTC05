<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

</head>

<body>

    <!-- Start of Form Section -->
    <main class="container py-4" style="max-width: 560px;">
        <!-- CHANGED: title centred, back button pinned to the left -->
        <div class="position-relative text-center mb-3">
            <a href="main.html"
                class="btn btn-outline-secondary btn-sm px-3 position-absolute start-0 top-50 translate-middle-y"
                aria-label="Back to main">&lt;</a>
            <h1 class="h3 mb-0">Add a clothing item</h1>
        </div>
        <form id="addItemForm" novalidate>
            <div class="mb-3">
                <label for="itemNameInput" class="form-label">Item name</label>
                <input type="text" id="itemNameInput" class="form-control" placeholder="e.g. Blue jeans" required />
            </div>
            <div class="mb-3">
                <label for="itemTypeInput" class="form-label">Type</label>
                <select id="itemTypeInput" class="form-select" required>
                    <option value="shirt">Shirt</option>
                    <option value="pants">Pants</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="colorInput" class="form-label">Color</label>
                <input type="text" id="colorInput" class="form-control" placeholder="e.g. blue" />
            </div>
            <div class="mb-3">
                <label for="imageUrlInput" class="form-label">Image URL (optional)</label>
                <input type="url" id="imageUrlInput" class="form-control" placeholder="https://..." />
            </div>
            <button type="submit" class="btn btn-primary w-100">Save item</button>
        </form>
    </main>
    <!-- End of Form Section -->

    <!-- Start of Navbar section -->

    <nav class="navbar fixed-bottom bg-light border-top p-0">
        <ul class="nav nav-justified w-100">
            <li class="nav-item">
                <a class="d-flex flex-column align-items-center nav-link py-3" href="main.html" aria-current="page">
                    <img class="mh-100 mw-100" src="images/Home.svg">
                    <span class="text-dark">Home</span>
                </a>
            </li>
    
            <li class="nav-item">
                <a class="d-flex flex-column align-items-center nav-link py-3" href="add.html">
                    <img class="mh-100 mw-100" src="images/Add.svg">
                    <span class="text-success fw-bold">Add</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="d-flex flex-column align-items-center nav-link py-3" href="closet.html">
                    <img class="mh-100 mw-100" src="images/Closet.svg">
                    <span class="text-dark">Closet</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="d-flex flex-column align-items-center nav-link py-3" href="profile.html">
                    <img class="mh-100 mw-100" src="images/Profile.svg">
                    <span class="text-dark">Profile</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- End of Navbar section -->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/app.js"></script>
    <script type="module" src="./src/add.js"></script>

</body>

</html>
