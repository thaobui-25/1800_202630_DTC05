<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

</head>

<body>

    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <!-- Start of Hero Section -->

    <main class="container py-4" style="max-width: 560px;">
        <h1>Add a new outfit</h1>
    
        <form id="addOutfitForm" novalidate>
            <div class="mb-3">
                <label for="outfitNameInput" class="form-label">Outfit's name</label>
                <input type="text" id="outfitNameInput" class="form-control" placeholder="..." required />
            </div>
            <div class="mb-3">
                <label for="cityInput" class="form-label">City</label>
                <input type="text" id="cityInput" class="form-control" placeholder="..." required />
            </div>
            <div class="mb-3">
                <label for="lengthInput" class="form-label">Length (m)</label>
                <input type="number" id="lengthInput" class="form-control" step="0.1" min="0" required />
            </div>
            <div class="mb-3">
                <label for="detailsInput" class="form-label">Details</label>
                <textarea id="detailsInput" class="form-control" rows="3"
                    placeholder="What makes this outfit special?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Save outfit</button>
        </form>
    </main>
    <!-- End of Hero Section -->

    <!-- Start of Card section -->

    <!-- Start of Navbar section -->

    <nav class="navbar fixed-bottom bg-light border-top">
        <div class="container-fluid">
            <ul class="nav w-100 d-flex justify-content-between px-2">
                <li class="nav-item active flex-fill">
                    <a class="nav-link text-dark text-center" href="#">Home</a>
                </li>
                <li class="nav-item flex-fill">
                    <a class="nav-link text-dark text-center" href="#">Search</a>
                </li>
                <li class="nav-item flex-fill">
                    <a class="nav-link text-success text-center" href="#">Add</a>
                </li>
                <li class="nav-item flex-fill">
                    <a class="nav-link text-dark text-center" href="#">Closet</a>
                </li>
                <li class="nav-item flex-fill">
                    <a class="nav-link text-dark text-center" href="#">Profile</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- End of Navbar section -->

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/app.js"></script>
    <script type="module" src="src/add.js"></script>

</body>

</html>
