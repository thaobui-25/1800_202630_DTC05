<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sign up</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<!-- Same body classes as login.html: green background, full height, stacked top to bottom -->

<body class="bg-success bg-gradient min-vh-100 d-flex flex-column p-3">

    <!-- Logo and title at the top of the page -->
    <header class="text-center text-white pt-3 pb-2">
        <i class="bi bi-handbag display-3"></i>
        <h1 class="h3 fw-bold mt-2 mb-1">Clothing Catalog</h1>
        <!-- CHANGED: subtitle now says sign up instead of log in -->
        <p class="mb-0 opacity-75">Create an account to start your closet</p>
    </header>

    <!-- Card centred in the remaining space -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="w-100" style="max-width: 420px;">

            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4">

                    <!-- Alerts -->
                    <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

                    <!-- Signup -->
                    <div id="signupView">
                        <form id="signupForm" novalidate>
                            <!-- CHANGED: form-control-lg and autocomplete, like the login form -->
                            <div class="mb-3">
                                <input type="text" id="signupName" class="form-control form-control-lg"
                                    placeholder="First and Last Name" aria-label="Full name" autocomplete="name"
                                    required />
                            </div>
                            <div class="mb-3">
                                <input type="email" id="signupEmail" class="form-control form-control-lg"
                                    placeholder="Email" autocomplete="email" inputmode="email" required />
                            </div>
                            <div class="mb-3">
                                <input type="password" id="signupPassword" class="form-control form-control-lg"
                                    placeholder="Password" autocomplete="new-password" required />
                            </div>
                            <button type="submit" class="btn btn-success btn-lg w-100">Create Account</button>
                        </form>

                        <small class="d-block mt-3 text-center">
                            Already have an account?
                            <!-- CHANGED: removed id="toLogin", see the note below -->
                            <a href="login.html" class="fw-semibold">Login</a>
                        </small>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script type="module" src="/src/app.js"></script>

    <!-- Firebase and authentication related scripts -->
    <!-- The order of loading matters -->
    <script type="module" src="/src/firebaseConfig.js"></script>
    <script type="module" src="/src/authentication.js"></script>
    <script type="module" src="/src/loginSignup.js"></script>
</body>

</html>
