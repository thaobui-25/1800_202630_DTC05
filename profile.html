<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Other libraries go here -->

</head>

<body>

    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <!-- Start of Hero Section -->
        <main class="container py-4" style="max-width: 720px;">
        
            <!-- Header: avatar + name + email -->
            <div class="d-flex align-items-center gap-3 mb-4">
                <div id="avatar" class="rounded-circle bg-warning fw-bold fs-3 d-flex align-items-center justify-content-center"
                    style="width: 64px; height: 64px;">?</div>
                <div>
                    <h1 id="profileName" class="h3 mb-0">My profile</h1>
                    <small id="profileEmail" class="text-muted"></small>
                </div>
            </div>
        
            <!-- About me section -->
            <div class="card shadow-sm mb-5">
                <div class="card-body">
                    <h2 class="h5 card-title mb-3"><i class="bi bi-person-fill me-1"></i>About me</h2>
                    <div id="profileAlert" class="alert alert-success d-none" role="alert"></div>
        
                    <form id="profileForm" novalidate>
                        <div class="mb-3">
                            <label for="nameInput" class="form-label">Name</label>
                            <input type="text" id="nameInput" class="form-control" disabled />
                        </div>
                        <div class="mb-3">
                            <label for="countryInput" class="form-label">Country</label>
                            <input type="text" id="countryInput" class="form-control" disabled />
                        </div>
                        <div class="mb-3">
                            <label for="schoolInput" class="form-label">School</label>
                            <input type="text" id="schoolInput" class="form-control" disabled />
                        </div>
                        <div class="mb-3">
                            <label for="bioInput" class="form-label">About me</label>
                            <textarea id="bioInput" class="form-control" rows="3" disabled></textarea>
                        </div>
                        <button type="button" id="editBtn" class="btn btn-outline-secondary">
                            <i class="bi bi-pencil me-1"></i>Edit
                        </button>
                        <button type="submit" id="saveBtn" class="btn btn-success" disabled>
                            <i class="bi bi-check-lg me-1"></i>Save
                        </button>
                    </form>
                </div>
            </div>
        </main>
    <!-- End of Hero Section -->



    <!-- Start of Navbar section -->

    <nav class="navbar fixed-bottom bg-light border-top p-0">
        <ul class="nav nav-justified w-100">
            <li class="nav-item">
                <a class="d-flex flex-column align-items-center nav-link py-3" href="main.html" aria-current="page">
                    <img class="mh-100 mw-100" src="images/Home.svg">
                    <span class="text-dark">Home</span>
                </a>
            </li>
    
            <li class="nav-item">
                <a class="d-flex flex-column align-items-center nav-link py-3" href="add.html">
                    <img class="mh-100 mw-100" src="images/Add.svg">
                    <span class="text-dark">Add</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="d-flex flex-column align-items-center nav-link py-3" href="closet.html">
                    <img class="mh-100 mw-100" src="images/Closet.svg">
                    <span class="text-dark">Closet</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="d-flex flex-column align-items-center nav-link py-3" href="profile.html">
                    <img class="mh-100 mw-100" src="images/Profile.svg">
                    <span class="text-success fw-bold">Profile</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- End of Navbar section -->

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/app.js"></script>
    <script type="module" src="/src/profile.js"></script>

</body>

</html>
